<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector DUI a QR - El Salvador</title>
  <!-- Tailwind CSS para diseño moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería de decodificación PDF417 -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <!-- Librería de generación de código QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @keyframes scanline {
      0% { top: 0%; }
      50% { top: 95%; }
      100% { top: 0%; }
    }
    .scanner-line {
      animation: scanline 2.2s infinite linear;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

  <!-- Encabezado -->
  <header class="w-full max-w-md text-center py-4 border-b border-gray-800">
    <h1 class="text-xl font-bold tracking-wide text-emerald-400">Escáner DUI a QR</h1>
    <p class="text-xs text-gray-400 mt-1">Control de Acceso Laboral</p>
  </header>

  <!-- Área Principal -->
  <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-4">
    
    <!-- Visor de la Cámara -->
    <div id="camera-card" class="w-full bg-gray-900 rounded-2xl p-4 border border-gray-800 shadow-2xl relative">
      <div id="video-wrapper" class="relative aspect-[4/3] w-full bg-black rounded-xl overflow-hidden border border-gray-700 flex items-center justify-center">
        <video id="video" class="w-full h-full object-cover"></video>
        
        <!-- Guías de Enfoque PDF417 -->
        <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none hidden">
          <div class="w-4/5 h-24 border-2 border-emerald-400 rounded-lg relative overflow-hidden shadow-[0_0_15px_rgba(52,211,153,0.3)]">
            <div class="scanner-line absolute left-0 right-0 h-0.5 bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
          </div>
          <p class="text-[10px] text-emerald-300 mt-2 font-mono bg-black/60 px-2 py-1 rounded">Alinee el código PDF417 del DUI aquí</p>
        </div>

        <p id="camera-placeholder" class="text-xs text-gray-500 text-center px-4">
          Presione "Activar Cámara" para otorgar permisos de escaneo.
        </p>
      </div>

      <!-- Botones de Acción -->
      <div class="mt-4 flex gap-2">
        <button id="btn-start" onclick="requestAndStartCamera()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-900/40 text-sm">
          Activar Cámara
        </button>
        <button id="btn-stop" onclick="stopScan()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-rose-900/40 text-sm hidden">
          Detener Cámara
        </button>
      </div>
    </div>

    <!-- Modal / Tarjeta del QR Temporal (Oculta por defecto) -->
    <div id="qr-modal" class="w-full bg-gray-900 rounded-2xl p-6 border border-emerald-500/40 shadow-2xl mt-4 hidden text-center">
      <span class="inline-block px-3 py-1 bg-emerald-500/10 text-emerald-400 text-[10px] font-semibold rounded-full border border-emerald-500/20 mb-3">
        CÓDIGO QR VÁLIDO GENERADO
      </span>
      
      <!-- Contenedor del QR -->
      <div class="flex justify-center my-2">
        <div id="qrcode" class="p-3 bg-white rounded-xl shadow-inner border border-gray-200"></div>
      </div>

      <!-- Temporizador -->
      <div class="mt-4 space-y-1">
        <div class="text-xs text-gray-400">Destrucción automática en RAM:</div>
        <div id="timer" class="text-2xl font-bold font-mono text-amber-400">30s</div>
      </div>

      <button onclick="closeQR()" class="mt-5 w-full bg-gray-800 hover:bg-gray-700 text-gray-200 font-medium py-2.5 rounded-xl text-xs transition border border-gray-700">
        Escanear Otro DUI
      </button>
    </div>

  </main>

  <!-- Pie de página -->
  <footer class="w-full max-w-md text-center py-2 text-[10px] text-gray-600">
    Procesamiento local efímero • Seguridad y privacidad garantizada
  </footer>

  <script>
    let codeReader;
    let selectedDeviceId;
    let timerInterval;

    window.addEventListener('load', () => {
      codeReader = new ZXing.BrowserPDF417Reader();
    });

    async function requestAndStartCamera() {
      try {
        // Solicita el permiso expreso de uso de cámara
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        stream.getTracks().forEach(track => track.stop());

        const videoDevices = await codeReader.getVideoInputDevices();
        
        if (videoDevices.length === 0) {
          alert("No se detectaron cámaras en su dispositivo.");
          return;
        }

        // Priorizar la cámara trasera
        const backCam = videoDevices.find(d => 
          d.label.toLowerCase().includes('back') || 
          d.label.toLowerCase().includes('trasera') || 
          d.label.toLowerCase().includes('rear')
        );
        
        selectedDeviceId = backCam ? backCam.deviceId : videoDevices[0].deviceId;

        // Modificar estado visual
        document.getElementById('camera-placeholder').classList.add('hidden');
        document.getElementById('overlay').classList.remove('hidden');
        document.getElementById('btn-start').classList.add('hidden');
        document.getElementById('btn-stop').classList.remove('hidden');

        // Escanear en tiempo real
        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
          if (result) {
            stopScan();
            generateTemporaryQR(result.text);
          }
        });

      } catch (err) {
        alert("Error de permisos de cámara: " + err.message);
      }
    }

    function stopScan() {
      if (codeReader) {
        codeReader.reset();
      }
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('camera-placeholder').classList.remove('hidden');
      document.getElementById('btn-start').classList.remove('hidden');
      document.getElementById('btn-stop').classList.add('hidden');
    }

    function generateTemporaryQR(rawText) {
      const modal = document.getElementById('qr-modal');
      const qrContainer = document.getElementById('qrcode');
      const timerLabel = document.getElementById('timer');
      
      qrContainer.innerHTML = "";
      modal.classList.remove('hidden');

      // Generar el QR
      new QRCode(qrContainer, {
        text: rawText,
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.M
      });

      // Cuenta regresiva de 30 segundos
      let timeLeft = 30;
      timerLabel.innerText = timeLeft + "s";
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerLabel.innerText = timeLeft + "s";
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          closeQR();
        }
      }, 1000);
    }

    function closeQR() {
      clearInterval(timerInterval);
      document.getElementById('qr-modal').classList.add('hidden');
      document.getElementById('qrcode').innerHTML = "";
    }
  </script>
</body>
</html>
