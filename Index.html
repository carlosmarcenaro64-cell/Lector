<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lector DUI a QR</title>
  <!-- Estilos e Infraestructura CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @keyframes scanline {
      0% { top: 0%; opacity: 0.8; }
      50% { top: 92%; opacity: 1; }
      100% { top: 0%; opacity: 0.8; }
    }
    .scanner-line {
      animation: scanline 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans select-none">

  <!-- Encabezado -->
  <header class="w-full max-w-md text-center py-3 border-b border-gray-800 flex items-center justify-between">
    <div class="text-left">
      <h1 class="text-lg font-bold tracking-wide text-emerald-400">Escáner DUI a QR</h1>
      <p class="text-[10px] text-gray-400">Control de Acceso Laboral</p>
    </div>
    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 font-mono px-2 py-1 rounded border border-emerald-500/30">GITHUB READY</span>
  </header>

  <!-- Contenido Principal -->
  <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-3">
    
    <!-- Tarjeta de la Cámara -->
    <div id="camera-card" class="w-full bg-gray-900 rounded-2xl p-3 border border-gray-800 shadow-2xl relative">
      <div id="video-wrapper" class="relative aspect-[4/3] w-full bg-black rounded-xl overflow-hidden border border-gray-700 flex items-center justify-center">
        <video id="video" class="w-full h-full object-cover" playsinline></video>
        
        <!-- Máscara de Enfoque PDF417 -->
        <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none hidden">
          <div class="w-5/6 h-28 border-2 border-emerald-400 rounded-xl relative overflow-hidden shadow-[0_0_20px_rgba(52,211,153,0.4)]">
            <div class="scanner-line absolute left-0 right-0 h-0.5 bg-emerald-400 shadow-[0_0_10px_#34d399]"></div>
          </div>
          <p class="text-[10px] text-emerald-300 mt-2 font-mono bg-black/70 px-2.5 py-1 rounded-full border border-emerald-500/30">
            Enfoque el código PDF417 del DUI
          </p>
        </div>

        <div id="camera-placeholder" class="text-center px-6">
          <svg class="w-10 h-10 mx-auto text-gray-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <p class="text-xs text-gray-400">Presione Activar para solicitar permisos de cámara</p>
        </div>
      </div>

      <!-- Botones de Control -->
      <div class="mt-3">
        <button id="btn-start" onclick="requestAndStartCamera()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-900/40 text-sm">
          Activar Cámara
        </button>
        <button id="btn-stop" onclick="stopScan()" class="w-full bg-rose-600 hover:bg-rose-500 active:scale-[0.99] text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-rose-900/40 text-sm hidden">
          Detener Cámara
        </button>
      </div>
    </div>

    <!-- Modal de Resultado (QR Generado) -->
    <div id="qr-modal" class="w-full bg-gray-900 rounded-2xl p-5 border border-emerald-500/50 shadow-2xl mt-3 hidden text-center">
      <span class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded-full border border-emerald-500/30 uppercase tracking-wider">
        QR Temporal Generado
      </span>
      
      <!-- Contenedor del QR impreso en blanco para alta lectabilidad -->
      <div class="flex justify-center p-3 bg-white rounded-2xl shadow-2xl my-3 border-4 border-white">
        <div id="qrcode"></div>
      </div>

      <!-- Cuenta regresiva en RAM -->
      <div class="mt-3 bg-gray-950 p-2.5 rounded-xl border border-gray-800 flex items-center justify-between px-4">
        <span class="text-xs text-gray-400">Destrucción automática en:</span>
        <span id="timer" class="text-xl font-bold font-mono text-amber-400">30s</span>
      </div>

      <button onclick="closeQR()" class="mt-3 w-full bg-gray-800 hover:bg-gray-700 active:scale-[0.99] text-gray-200 font-medium py-2.5 rounded-xl text-xs transition border border-gray-700">
        Escanear Nuevo DUI
      </button>
    </div>

  </main>

  <!-- Pie de página -->
  <footer class="w-full max-w-md text-center py-1 text-[10px] text-gray-600">
    Procesamiento directo en navegador local
  </footer>

  <script>
    let codeReader;
    let selectedDeviceId;
    let timerInterval;

    window.addEventListener('load', () => {
      codeReader = new ZXing.BrowserPDF417Reader();
    });

    async function requestAndStartCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        stream.getTracks().forEach(track => track.stop());

        const videoDevices = await codeReader.getVideoInputDevices();
        if (videoDevices.length === 0) {
          alert("No se detectaron cámaras en su dispositivo.");
          return;
        }

        const backCam = videoDevices.find(d => 
          d.label.toLowerCase().includes('back') || 
          d.label.toLowerCase().includes('trasera') || 
          d.label.toLowerCase().includes('rear')
        );
        
        selectedDeviceId = backCam ? backCam.deviceId : videoDevices[0].deviceId;

        document.getElementById('camera-placeholder').classList.add('hidden');
        document.getElementById('overlay').classList.remove('hidden');
        document.getElementById('btn-start').classList.add('hidden');
        document.getElementById('btn-stop').classList.remove('hidden');

        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
          if (result) {
            if (navigator.vibrate) navigator.vibrate(100);
            stopScan();
            generateTemporaryQR(result.text);
          }
        });

      } catch (err) {
        alert("Error al iniciar cámara: " + err.message);
      }
    }

    function stopScan() {
      if (codeReader) codeReader.reset();
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('camera-placeholder').classList.remove('hidden');
      document.getElementById('btn-start').classList.remove('hidden');
      document.getElementById('btn-stop').classList.add('hidden');
    }

    function generateTemporaryQR(rawText) {
      const modal = document.getElementById('qr-modal');
      const qrContainer = document.getElementById('qrcode');
      const timerLabel = document.getElementById('timer');
      
      qrContainer.innerHTML = "";
      modal.classList.remove('hidden');

      new QRCode(qrContainer, {
        text: rawText,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      let timeLeft = 30;
      timerLabel.innerText = timeLeft + "s";
      
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerLabel.innerText = timeLeft + "s";
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          closeQR();
        }
      }, 1000);
    }

    function closeQR() {
      clearInterval(timerInterval);
      document.getElementById('qr-modal').classList.add('hidden');
      document.getElementById('qrcode').innerHTML = "";
    }
  </script>
</body>
</html>
